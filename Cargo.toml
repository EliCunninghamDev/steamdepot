[workspace]
members = ["steamdepot", "steamdepot-cli", "steam-mail"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1-only"
repository = "https://github.com/EliCunninghamDev/steamdepot"
authors = ["Eli Cunningham"]

[workspace.dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
lzma-rs = "0.3"
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rsa = "0.9"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamdepot = { path = "steamdepot", version = "0.4.0" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `Error` carries reqwest/tungstenite errors, which are large. Boxing them
# would complicate every call site for negligible benefit in this library.
result_large_err = "allow"

[profile.release]
strip = true
