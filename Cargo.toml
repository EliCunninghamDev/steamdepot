[workspace]
members = ["steamdepot", "steamdepot-cli", "steam-mail"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
license = "LGPL-2.1-only"
repository = "https://github.com/EliCunninghamDev/steamdepot"
authors = ["Eli Cunningham"]

[workspace.dependencies]
aes = "0.9"
base64 = "0.23"
cbc = "0.2"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
getrandom = { version = "0.4", features = ["sys_rng"] }
lzma-rs = "0.3"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rsa = { version = "0.10", default-features = false, features = ["std", "getrandom", "pkcs1v15"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamdepot = { path = "steamdepot", version = "0.4.1" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `Error` carries reqwest/tungstenite errors, which are large. Boxing them
# would complicate every call site for negligible benefit in this library.
result_large_err = "allow"

[profile.release]
strip = true
